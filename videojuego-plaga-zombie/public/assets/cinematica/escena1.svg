<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <!-- Cielo nocturno -->
  <rect width="1920" height="1080" fill="#0a0a1a"/>
  
  <!-- Estrellas -->
  <circle cx="200" cy="100" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="400" cy="150" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="800" cy="80" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="1200" cy="120" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="1500" cy="90" r="2" fill="#fff" opacity="0.8"/>
  
  <!-- Mar -->
  <rect y="600" width="1920" height="480" fill="#0a1a2a"/>
  
  <!-- Puerto -->
  <rect x="0" y="500" width="600" height="580" fill="#1a1a1a"/>
  <rect x="50" y="520" width="80" height="200" fill="#2a2a2a"/>
  <rect x="150" y="480" width="100" height="240" fill="#2a2a2a"/>
  
  <!-- Barco en la distancia -->
  <rect x="1200" y="650" width="400" height="100" fill="#1a0a0a"/>
  <rect x="1350" y="580" width="100" height="70" fill="#2a0a0a"/>
  
  <!-- Luz del faro -->
  <circle cx="200" cy="450" r="30" fill="#ffaa00" opacity="0.3"/>
  <circle cx="200" cy="450" r="15" fill="#ffff00" opacity="0.6"/>
  
  <!-- Luna -->
  <circle cx="1700" cy="200" r="80" fill="#ffffcc" opacity="0.4"/>
  
  <!-- Texto -->
  <text x="960" y="950" text-anchor="middle" fill="#8b0000" font-size="48" font-family="Arial, sans-serif" font-weight="bold">
    ESCENA 1: PUERTO DE MANTA - NOCHE
  </text>
  <text x="960" y="1020" text-anchor="middle" fill="#999" font-size="24" font-family="Arial, sans-serif">
    Reemplaza este archivo con escena1.png
  </text>
</svg>
